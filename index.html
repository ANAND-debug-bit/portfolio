    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

  <body>
    <div id="root"></div>

    <!-- ===== Background audio (SoundCloud) ===== -->
    <iframe
      id="bg-audio-player"
      title="Background audio"
      width="0"
      height="0"
      scrolling="no"
      frameborder="no"
      style="position:absolute; visibility:hidden; width:0; height:0; border:0;"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fbenjamin_13%2Fbirds-of-a-feather-cover&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"
    ></iframe>
    <script src="https://w.soundcloud.com/player/api.js"></script>

    <style>
      #sound-toggle {
        position: fixed;
        left: 20px;
        bottom: 20px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: var(--text-secondary, currentColor);
        opacity: 0.65;
        transition: opacity 0.2s ease;
        padding: 4px 6px;
      }
      #sound-toggle:hover {
        opacity: 1;
      }
      #sound-toggle .icon {
        display: inline-flex;
        width: 14px;
        height: 14px;
      }
      #sound-toggle .icon svg {
        width: 100%;
        height: 100%;
      }

      /* Adapt to the site's existing light/dark theme */
      html[data-theme='dark'] #sound-toggle {
        color: #e5e5e5;
      }
      html[data-theme='light'] #sound-toggle {
        color: #1a1a1a;
      }

      @media (max-width: 640px) {
        #sound-toggle {
          left: 14px;
          bottom: 14px;
          font-size: 11px;
        }
      }
    </style>

    <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Toggle background sound">
      <span class="icon" id="sound-icon">
        <!-- speaker "on" icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </span>
      <span id="sound-label">Sound: On</span>
    </button>

    <script>
      (function () {
        var widget = null;
        var isPlaying = true;
        var toggleBtn = document.getElementById('sound-toggle');
        var label = document.getElementById('sound-label');
        var iconEl = document.getElementById('sound-icon');

        var ICON_ON =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
          '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';

        var ICON_OFF =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
          '<line x1="23" y1="9" x2="17" y2="15"></line>' +
          '<line x1="17" y1="9" x2="23" y2="15"></line></svg>';

        function initWidget() {
          if (window.SC && document.getElementById('bg-audio-player')) {
            widget = SC.Widget('bg-audio-player');
          }
        }

        // Wait for the SoundCloud API script to load
        var apiCheck = setInterval(function () {
          if (window.SC) {
            clearInterval(apiCheck);
            initWidget();
          }
        }, 100);

        toggleBtn.addEventListener('click', function () {
          if (!widget) return;
          if (isPlaying) {
            widget.pause();
            label.textContent = 'Sound: Off';
            iconEl.innerHTML = ICON_OFF;
            toggleBtn.setAttribute('aria-pressed', 'false');
          } else {
            widget.play();
            label.textContent = 'Sound: On';
            iconEl.innerHTML = ICON_ON;
            toggleBtn.setAttribute('aria-pressed', 'true');
          }
          isPlaying = !isPlaying;
        });
      })();
    </script>
